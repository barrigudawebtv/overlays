<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        /* Remove qualquer fundo para transparência total */
        body {
            margin: 0;
            padding: 0;
            background-color: rgba(0, 0, 0, 0); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #ffffff; /* Cor do texto (ajuste como preferir) */
            font-size: 4rem;
            text-align: center;
            text-transform: uppercase;
            /* Sombra para leitura em fundos claros/escuros */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8); 
            animation: blinker 1.2s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0.1; }
        }
    </style>
</head>
<body>

    <h1>Iniciaremos em instantes.</h1>

</body>
</html>
