<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Placar Live</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="scoreboard-view" class="scoreboard-container">
        <div class="status-box" id="status">---</div>
        <div class="scoreboard-bar">
            <div class="team" id="teamA">TIME A</div>
            <div class="score-time-box">
                <div class="main-score" id="score">0 X 0</div>
                <div class="timer" id="timer">00:00</div>
            </div>
            <div class="team" id="teamB">TIME B</div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
