<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Professor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 40px; }
        .container { background: #f8fafc; color: #1e293b; padding: 30px; border-radius: 20px; width: 420px; box-shadow: 0 20px 25px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #FF8C00; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        label { display: block; margin-top: 20px; font-weight: 600; font-size: 0.9rem; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 1rem; background: white; }
        .group-btns { margin-top: 30px; display: grid; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-save { background: #4497D2; color: white; }
        .btn-toggle { background: #FF8C00; color: white; }
        .btn-active { background: #ef4444 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Controle da Live</h2>
    
    <label>Escolha a Mensagem:</label>
    <select id="mainText">
        <option value="Aguarde alguns instantes">Aguarde alguns instantes</option>
        <option value="Entraremos em breve">Entraremos em breve</option>
        <option value="Obrigado por assistir!">Obrigado por assistir!</option>
        <option value="Esperamos você na próxima live">Esperamos você na próxima live</option>
        <option value="Isso é uma live de teste">Isso é uma live de teste</option>
    </select>

    <label>Carregar Logotipo (PNG):</label>
    <input type="file" id="logoFile" accept="image/png">

    <div class="group-btns">
        <button class="btn-save" onclick="updateData()">SALVAR E ENVIAR</button>
        <button id="toggleBtn" class="btn-toggle" onclick="handleVisibility()">EXIBIR NO OBS</button>
    </div>
</div>

<script>
    let isVisible = false;
    let base64Image = "";

    document.getElementById('logoFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function() { base64Image = reader.result; };
        reader.readAsDataURL(e.target.files[0]);
    });

    function updateData() {
        const payload = {
            texto: document.getElementById('mainText').value,
            logo: base64Image || (JSON.parse(localStorage.getItem('obs_overlay_data'))?.logo || ""),
            visible: isVisible
        };
        localStorage.setItem('obs_overlay_data', JSON.stringify(payload));
        alert("Overlay atualizado!");
    }

    function handleVisibility() {
        isVisible = !isVisible;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = isVisible ? "OCULTAR AGORA" : "EXIBIR NO OBS";
        isVisible ? btn.classList.add('btn-active') : btn.classList.remove('btn-active');

        const currentData = JSON.parse(localStorage.getItem('obs_overlay_data')) || {};
        currentData.visible = isVisible;
        localStorage.setItem('obs_overlay_data', JSON.stringify(currentData));
    }
</script>
</body>
</html>
